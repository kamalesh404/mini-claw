name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Audit Python dependencies
        working-directory: ./mini-claw/backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --format=json --output=audit.json || true
      
      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: python-audit
          path: mini-claw/backend/audit.json
      
      - name: Audit Node dependencies
        working-directory: ./mini-claw/frontend
        run: |
          npm audit --json > audit.json || true
      
      - name: Upload Node audit
        uses: actions/upload-artifact@v4
        with:
          name: node-audit
          path: mini-claw/frontend/audit.json

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    strategy:
      matrix:
        language: [python, javascript]
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD