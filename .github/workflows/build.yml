name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./mini-claw
          file: ./mini-claw/docker/Dockerfile.backend
          push: false
          tags: miniclaw/backend:${{ github.sha }}
          load: true
      
      - name: Test backend image
        run: |
          docker run --rm miniclaw/backend:${{ github.sha }} python -c "import app.main; print('OK')"

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./mini-claw
          file: ./mini-claw/docker/Dockerfile.frontend
          push: false
          tags: miniclaw/frontend:${{ github.sha }}
          load: true
      
      - name: Test frontend image
        run: |
          docker run --rm -d -p 8080:80 --name frontend-test miniclaw/frontend:${{ github.sha }}
          sleep 5
          curl -f http://localhost:8080 || exit 1
          docker stop frontend-test

  build-docker-compose:
    name: Build Docker Compose
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build with docker-compose
        working-directory: ./mini-claw/docker
        run: |
          docker-compose build
      
      - name: Test docker-compose
        working-directory: ./mini-claw/docker
        run: |
          docker-compose up -d
          sleep 30
          curl -f http://localhost:8000/api/health || exit 1
          curl -f http://localhost:80 || exit 1
          docker-compose down